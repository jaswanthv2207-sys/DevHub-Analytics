name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, build & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Production build
        run: npm run build
        env:
          # The build must not require secrets; the JWT guard only trips at runtime.
          NODE_ENV: production

      - name: Smoke test the API
        run: |
          JWT_SECRET=ci-smoke-secret-value-that-is-long-enough NODE_ENV=production PORT=4100 npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4100/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4100/api/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null -w '%{http_code}' http://localhost:4100/ | grep -q 200
